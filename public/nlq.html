<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NYC Summer Meals — accessibility-aware map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --green:  #22c55e;
      --amber:  #f59e0b;
      --red:    #ef4444;
      --bg:     #0b1220;
      --panel:  #101827;
      --raised: #182236;
      --text:   #e5e7eb;
      --muted:  #94a3b8;
      --border: #263041;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--text); background: var(--bg); }
    a { color: var(--accent); }
    #app { display: grid; grid-template-columns: 1fr 400px; height: 100vh; }
    @media (max-width: 820px) { #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } #sidebar { max-height: 50vh; overflow-y: auto; } }
    #map { height: 100%; width: 100%; background: #0b1220; }
    .leaflet-container { background: #0b1220; }
    #sidebar { background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
    header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
    header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: 0.01em; }
    header nav a { font-size: 12px; text-decoration: none; margin-left: 12px; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
    input[type=text], input[type=date] { width: 100%; padding: 9px 10px; font-size: 14px; background: var(--raised); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .row { display: flex; gap: 6px; }
    .row > input { flex: 1; }
    button { padding: 9px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--raised); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: wait; }
    .autocomplete { position: relative; }
    .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: var(--raised); border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px; max-height: 200px; overflow-y: auto; z-index: 400; display: none; }
    .suggestions.open { display: block; }
    .suggestions div { padding: 8px 10px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .suggestions div:hover, .suggestions div.hi { background: #1e293b; }
    .notice { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .status { font-size: 12px; color: var(--muted); margin: 8px 0; min-height: 1em; }
    .banner { font-size: 12px; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid; }
    .banner.warn { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.4); color: #fbbf24; }
    .banner.alert { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.45); color: #fca5a5; }
    .parse { background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 11px; color: var(--muted); margin-bottom: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-word; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; color: #0b1220; text-transform: uppercase; letter-spacing: 0.06em; }
    .badge.green { background: var(--green); }
    .badge.amber { background: var(--amber); }
    .badge.red { background: var(--red); }
    .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; margin-right: 4px; margin-top: 4px; border: 1px solid; }
    .chip.match { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.45); color: #86efac; }
    .chip.unknown { background: rgba(148,163,184,0.10); border-color: rgba(148,163,184,0.35); color: var(--muted); }
    .chip.block { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.45); color: #fca5a5; }
    .site-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; max-height: 40vh; overflow-y: auto; }
    .site-list .item { padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--raised); cursor: pointer; }
    .site-list .item:hover { border-color: var(--accent); }
    .site-list .item .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .site-list .item .name { font-size: 13px; font-weight: 600; }
    .site-list .item .dist { font-size: 11px; color: var(--muted); }
    .site-list .item .addr { font-size: 12px; color: var(--muted); }
    .detail { padding: 12px; border-top: 1px solid var(--border); }
    .detail h2 { font-size: 14px; margin: 8px 0 4px; }
    .detail .addr { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
    .detail dl { margin: 0; font-size: 12px; }
    .detail dt { color: var(--muted); font-weight: 600; margin-top: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .detail dd { margin: 4px 0 0 0; }
    .detail ul { margin: 4px 0 0; padding-left: 18px; }
    .detail li { margin-bottom: 3px; word-break: break-word; }
    .detail a { color: var(--accent); text-decoration: none; }
    .hint { color: var(--muted); font-size: 12px; padding: 8px; }
    /* Along-the-way overlay layer (additive). */
    .layer-toggle { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-size: 12px; color: var(--muted); }
    .layer-toggle input { accent-color: var(--accent); }
    .lib-marker { background: #7c3aed; width: 12px; height: 12px; border: 2px solid #0b1220; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,0.15); }
    details.corridor { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px; }
    details.corridor > summary { cursor: pointer; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; padding: 4px 0; }
    details.corridor > summary::marker { color: var(--accent); }
    .corridor-item { padding: 6px 0; border-top: 1px dashed var(--border); font-size: 12px; }
    .corridor-item:first-of-type { border-top: none; }
    .corridor-item .n { font-weight: 600; }
    .corridor-item .m { color: var(--muted); }
    .corridor-item .src { color: var(--muted); font-size: 10px; margin-top: 2px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .corridor-item .lib-chip { display: inline-block; background: rgba(124,58,237,0.2); color: #c4b5fd; border: 1px solid rgba(124,58,237,0.5); padding: 1px 6px; border-radius: 999px; font-size: 10px; margin-right: 4px; }
    .corridor-item .meal-chip { display: inline-block; background: rgba(34,197,94,0.15); color: #86efac; border: 1px solid rgba(34,197,94,0.4); padding: 1px 6px; border-radius: 999px; font-size: 10px; margin-right: 4px; }
    .c311 { padding: 6px 0; border-top: 1px dashed var(--border); font-size: 12px; }
    .c311 .n { font-weight: 600; margin-right: 6px; }
    .c311 .m { color: var(--muted); }
    .c311 .src { color: var(--muted); font-size: 10px; margin-top: 2px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .c311 .type-row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 11px; }
    .contradiction { background: rgba(245,158,11,0.14); border: 1px solid rgba(245,158,11,0.55); color: #fcd34d; padding: 8px 10px; border-radius: 6px; margin-top: 8px; font-size: 12px; line-height: 1.4; }
    .contradiction strong { color: #fde68a; }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <aside id="sidebar">
      <header>
        <h1 id="titleEl">NYC Summer Meals</h1>
        <nav><a href="about.html">About</a></nav>
      </header>

      <div class="field autocomplete">
        <label id="intentLabel" for="intentInput">What do you need?</label>
        <input id="intentInput" type="text" autocomplete="off" />
      </div>

      <div class="field autocomplete">
        <label id="addressLabel" for="addressInput">Your location (optional)</label>
        <div class="row">
          <input id="addressInput" type="text" autocomplete="off" />
          <button id="geolocateBtn" type="button" title="Use my location">📍</button>
        </div>
        <div id="suggestions" class="suggestions"></div>
        <div class="notice" id="privacyNotice"></div>
      </div>

      <div class="field">
        <label id="dateLabel" for="dateInput">Date to check</label>
        <input id="dateInput" type="date" />
      </div>

      <button id="searchBtn" class="primary" type="button" style="width:100%">Search</button>

      <label class="layer-toggle">
        <input type="checkbox" id="toggleLibraries" checked />
        <span id="toggleLibrariesLabel">Show libraries</span>
      </label>

      <div class="status" id="status"></div>
      <div id="banners"></div>
      <div id="parseBox"></div>
      <div id="siteList" class="site-list"></div>
      <div id="detail" class="hint">Click a marker to see verdict, reasons, and provenance.</div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { getVerdict } from "./lib/verdict.js";
    import { keywordParse, rankSites, haversineMiles } from "./lib/filter.js";

    // ---- state ------------------------------------------------------------
    const state = {
      sites: [],
      stations: {},
      origin: null,           // { lat, lng, label }
      parsed: null,           // last parse result
      parseSource: null,      // "api" | "fallback"
      parseError: null,
      selectedDate: nextMondayOrTomorrow(),
      lang: "en",
      i18n: null,
      decorated: [],          // rankSites output
    };

    const $ = (id) => document.getElementById(id);
    const COLORS = { green: "#22c55e", amber: "#f59e0b", red: "#ef4444" };

    // ---- utility ----------------------------------------------------------
    function nextMondayOrTomorrow() {
      // Default: tomorrow. Demo is Sunday and no sites are open Sundays,
      // so tomorrow = Monday will surface Mon-Fri + Sat-open sites cleanly.
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return d;
    }
    function toIsoDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }
    function fromIsoDate(s) {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function tr(key, vars = {}) {
      const dict = state.i18n ?? {};
      let s = dict[key] ?? key;
      for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, String(v));
      return s;
    }
    async function loadDict(lang) {
      const tryLang = ["en", "es", "zh", "bn", "ru"].includes(lang) ? lang : "en";
      try {
        const res = await fetch(`data/i18n/${tryLang}.json`);
        if (!res.ok) throw new Error(`i18n ${res.status}`);
        return { lang: tryLang, dict: await res.json() };
      } catch {
        const res = await fetch(`data/i18n/en.json`);
        return { lang: "en", dict: await res.json() };
      }
    }

    function applyI18n() {
      $("titleEl").textContent = tr("title");
      document.title = tr("title");
      $("intentLabel").textContent = tr("intentLabel");
      $("intentInput").placeholder = tr("intentPlaceholder");
      $("addressLabel").textContent = tr("addressLabel");
      $("addressInput").placeholder = tr("addressPlaceholder");
      $("geolocateBtn").title = tr("useLocation");
      $("privacyNotice").textContent = tr("privacyNotice");
      $("dateLabel").textContent = tr("dateLabel");
      $("searchBtn").textContent = tr("searchButton");
      document.documentElement.lang = state.lang;
    }

    // ---- map --------------------------------------------------------------
    const map = L.map("map").setView([40.7580, -73.9855], 11);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      subdomains: "abcd",
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    }).addTo(map);
    const markers = new Map(); // id -> Leaflet marker
    let originMarker = null;
    // Additive overlay layer for libraries (and later 311/cooling/permits).
    // If this fails to load, the rest of the map keeps working.
    const overlayLayers = { libraries: L.layerGroup() };
    let overlaysData = null; // { _meta, "<siteId>": { libraries: [...] } }

    // ---- data load --------------------------------------------------------
    async function loadData() {
      const [sites, stations, dict] = await Promise.all([
        fetch("data/sites.json").then((r) => r.json()),
        fetch("data/stations.json").then((r) => r.json()),
        loadDict("en"),
      ]);
      state.sites = sites;
      state.stations = stations;
      state.lang = dict.lang;
      state.i18n = dict.dict;
    }

    // Fault-tolerant: overlay is additive and optional. Silent failure.
    async function loadOverlays() {
      try {
        const res = await fetch("data/overlays.json");
        if (!res.ok) return;
        overlaysData = await res.json();
      } catch (err) {
        console.warn("overlays.json unavailable — corridor context disabled", err);
        overlaysData = null;
      }
    }

    function renderLibraryLayer() {
      overlayLayers.libraries.clearLayers();
      if (!overlaysData) return;
      // Deduplicate library markers (a branch can be in >1 site's corridor).
      const seen = new Map();
      for (const [siteId, entry] of Object.entries(overlaysData)) {
        if (siteId.startsWith("_")) continue;
        for (const lib of entry.libraries ?? []) {
          if (!seen.has(lib.id)) seen.set(lib.id, lib);
        }
      }
      for (const lib of seen.values()) {
        const icon = L.divIcon({ className: "", html: '<div class="lib-marker"></div>', iconSize: [12, 12], iconAnchor: [6, 6] });
        const marker = L.marker([lib.lat, lib.lng], { icon });
        marker.bindTooltip(`${lib.name} (${lib.system})`, { direction: "top", offset: [0, -6] });
        overlayLayers.libraries.addLayer(marker);
      }
    }

    // ---- rendering --------------------------------------------------------
    function stationFor(site) {
      return site.nearestStationId ? state.stations[site.nearestStationId] : null;
    }

    function verdictFor(site) {
      return getVerdict(site, stationFor(site), state.selectedDate);
    }

    function renderMarkers() {
      for (const m of markers.values()) map.removeLayer(m);
      markers.clear();
      const rows = state.decorated.length ? state.decorated : state.sites.map((s) => ({ site: s, distanceMiles: null, chips: [] }));
      for (const row of rows) {
        const site = row.site;
        if (site.lat == null || site.lng == null) continue;
        const v = verdictFor(site);
        const marker = L.circleMarker([site.lat, site.lng], {
          radius: 8,
          weight: 2,
          color: "#0b1220",
          fillColor: COLORS[v.state] ?? "#94a3b8",
          fillOpacity: 0.95,
        }).addTo(map);
        marker.on("click", () => {
          showDetail(row);
          $("siteList").querySelectorAll(".item").forEach((el) => el.classList.remove("hi"));
        });
        markers.set(site.id, marker);
      }
    }

    function fitToAllSites() {
      const pts = state.sites
        .filter((s) => s.lat != null && s.lng != null)
        .map((s) => [s.lat, s.lng]);
      if (pts.length === 0) return;
      map.fitBounds(L.latLngBounds(pts), { padding: [40, 40] });
    }

    function renderList() {
      const list = $("siteList");
      list.innerHTML = "";
      if (!state.decorated.length) return;
      const top = state.decorated.slice(0, 25);
      for (const row of top) {
        const v = verdictFor(row.site);
        const el = document.createElement("div");
        el.className = "item";
        const distText = row.distanceMiles != null ? tr("distanceMiles", { miles: row.distanceMiles.toFixed(1) }) : "";
        el.innerHTML = `
          <div class="top">
            <span class="badge ${v.state}">${tr("verdict" + v.state[0].toUpperCase() + v.state.slice(1))}</span>
            <span class="dist">${escapeHtml(distText)}</span>
          </div>
          <div class="name">${escapeHtml(row.site.name)}</div>
          <div class="addr">${escapeHtml(row.site.address)}</div>
          ${row.chips.map((c) => `<span class="chip ${c.kind}">${escapeHtml(c.text)}</span>`).join("")}
        `;
        el.addEventListener("click", () => {
          showDetail(row);
          const m = markers.get(row.site.id);
          if (m) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 14)); m.openPopup?.(); }
        });
        list.appendChild(el);
      }
    }

    function showDetail(row) {
      const site = row.site;
      const v = verdictFor(site);
      const station = stationFor(site);
      const days = Array.isArray(site.daysOpen) ? site.daysOpen.join(", ") : "";
      const phoneLink = site.phone
        ? `<a href="tel:${escapeHtml(String(site.phone).replace(/[^0-9+]/g, ""))}">${escapeHtml(site.phone)}</a>`
        : "";
      const distLine = row.distanceMiles != null
        ? `<dt>${escapeHtml(tr("distanceMiles", { miles: "" })).replace("mi away", "").trim()}</dt><dd>${row.distanceMiles.toFixed(2)} mi</dd>`
        : "";
      $("detail").className = "detail";
      $("detail").innerHTML = `
        <span class="badge ${v.state}">${tr("verdict" + v.state[0].toUpperCase() + v.state.slice(1))}</span>
        <h2 style="margin-top:8px">${escapeHtml(site.name)}</h2>
        <p class="addr">${escapeHtml(site.address)}</p>
        ${row.chips.length ? `<div>${row.chips.map((c) => `<span class="chip ${c.kind}">${escapeHtml(c.text)}</span>`).join("")}</div>` : ""}
        <dl>
          <dt>${escapeHtml(tr("verdictReasons"))}</dt>
          <dd><ul>${v.reasons.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul></dd>
          <dt>${escapeHtml(tr("provenance"))}</dt>
          <dd><ul>${v.provenance.map((p) => `<li>${escapeHtml(p)}</li>`).join("")}</ul></dd>
          ${phoneLink ? `<dt>${escapeHtml(tr("phone"))}</dt><dd>${phoneLink}</dd>` : ""}
          ${days ? `<dt>${escapeHtml(tr("open"))}</dt><dd>${escapeHtml(days)}</dd>` : ""}
          ${site.hoursText ? `<dt>${escapeHtml(tr("hours"))}</dt><dd>${escapeHtml(site.hoursText)}</dd>` : ""}
          ${site.nearestStationId ? `<dt>${escapeHtml(tr("nearestStation"))}</dt><dd>${escapeHtml(site.nearestStationId)}${station ? ` — ADA=${station.ada}, ${station.elevators?.length ?? 0} elevators` : ""}</dd>` : ""}
          ${distLine}
        </dl>
        ${renderCorridorSection(site)}
      `;
    }

    // Along-the-way corridor block. Fault-tolerant: if overlaysData is null
    // (fetch failed) we render nothing. Never blocks the main panel.
    function renderCorridorSection(site) {
      if (!overlaysData) return "";
      const entry = overlaysData[site.id];
      if (!entry) return "";

      const libs = Array.isArray(entry.libraries) ? entry.libraries : [];
      const c311 = entry.complaints311 ?? null;
      const has311 = c311 && c311.total > 0;
      if (libs.length === 0 && !has311) return "";

      const libSrc = overlaysData._meta?.sources?.libraries;
      const libSrcLine = libSrc
        ? `${escapeHtml(libSrc.dataset)} · pulled ${escapeHtml((libSrc.pulled_at ?? "").slice(0, 10))}`
        : "";

      const libItems = libs.map((lib) => `
        <div class="corridor-item">
          <span class="lib-chip">${escapeHtml(lib.system ?? "Library")}</span>
          ${lib.isMealSite ? '<span class="meal-chip">★ also a meal site</span>' : ""}
          <span class="n">${escapeHtml(lib.name)}</span>
          <span class="m"> — ${escapeHtml(lib.address)}</span>
          <div class="m">${lib.distanceMeters != null ? lib.distanceMeters + " m along the corridor" : ""}</div>
          ${libSrcLine ? `<div class="src">${libSrcLine}</div>` : ""}
        </div>
      `).join("");

      let c311Block = "";
      if (has311) {
        const src = overlaysData._meta?.sources?.complaints311;
        const srcLine = src
          ? `${escapeHtml(src.dataset)} · last ${src.lookback_days ?? 90} days · pulled ${escapeHtml((src.pulled_at ?? "").slice(0, 10))}`
          : "";
        const typeRows = Object.entries(c311.byType)
          .sort((a, b) => b[1] - a[1])
          .map(([type, n]) => `<div class="type-row"><span>${escapeHtml(type)}</span><span class="m">${n}</span></div>`)
          .join("");
        // Contradiction notice — context only. Never changes verdict state.
        const contradictionBlock = c311.contradictionElevator
          ? `<div class="contradiction"><strong>Agency status and resident reports disagree.</strong>
             The nearest ADA station's elevators are reported <em>in service</em>, but
             ${c311.byType["Elevator"] ?? 0} elevator complaint(s) have been filed in the
             corridor over the last ${src?.lookback_days ?? 90} days. This is context, not
             a verdict input — check the MTA live elevator status before you go.</div>`
          : "";
        c311Block = `
          <div class="c311">
            <div><span class="n">311 complaints in corridor</span><span class="m">${c311.total} total, last ${src?.lookback_days ?? 90} days</span></div>
            ${typeRows}
            ${srcLine ? `<div class="src">${srcLine}</div>` : ""}
            ${contradictionBlock}
          </div>
        `;
      }

      const parts = [];
      if (libs.length > 0) {
        parts.push(`<div><strong style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">Libraries (${libs.length})</strong></div>`);
        parts.push(libItems);
      }
      if (c311Block) parts.push(c311Block);

      const summary = [
        libs.length > 0 ? `${libs.length} ${libs.length === 1 ? "library" : "libraries"}` : "",
        has311 ? `${c311.total} 311` : "",
        c311?.contradictionElevator ? "⚠ elevator contradiction" : "",
      ].filter(Boolean).join(" · ");

      return `
        <details class="corridor" open>
          <summary>Along the way — ${summary}</summary>
          ${parts.join("")}
        </details>
      `;
    }

    function renderBanners() {
      const b = $("banners");
      const parts = [];
      if (state.parseSource === "fallback") {
        parts.push(`<div class="banner warn">${escapeHtml(tr("fallbackNotice"))}${state.parseError ? " (" + escapeHtml(state.parseError) + ")" : ""}</div>`);
      }
      if (state.parsed?.allergyWarning) {
        parts.push(`<div class="banner alert">${escapeHtml(tr("allergyWarning"))}</div>`);
      }
      b.innerHTML = parts.join("");
    }

    function renderParseBox() {
      const box = $("parseBox");
      if (!state.parsed) { box.innerHTML = ""; return; }
      box.innerHTML = `<div class="parse"><strong>${escapeHtml(tr("parsedIntent"))}:</strong> ${escapeHtml(JSON.stringify(state.parsed))}</div>`;
    }

    function renderStatus() {
      let s = tr("sitesLoaded", { n: state.sites.length });
      if (state.origin) s += " " + tr("sitesMatchingOrigin", { origin: state.origin.label });
      else s += " " + tr("sitesNoOrigin");
      $("status").textContent = s;
    }

    // ---- parse call -------------------------------------------------------
    async function callParse(query) {
      try {
        const res = await fetch("../api/parse", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ query }),   // NEVER send address or geolocation
        });
        if (!res.ok) return { parsed: keywordParse(query), source: "fallback", reason: `api ${res.status}` };
        const parsed = await res.json();
        return { parsed, source: "api" };
      } catch (err) {
        return { parsed: keywordParse(query), source: "fallback", reason: String(err.message ?? err) };
      }
    }

    // ---- geocoding (client-side only; NEVER sent to /api/parse) ----------
    let acTimer = null;
    async function autocomplete(text) {
      if (!text || text.length < 3) { hideSuggestions(); return; }
      try {
        const url = `https://geosearch.planninglabs.nyc/v2/autocomplete?text=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        if (!res.ok) { hideSuggestions(); return; }
        const data = await res.json();
        showSuggestions(data.features ?? []);
      } catch {
        hideSuggestions();
      }
    }
    function showSuggestions(features) {
      const box = $("suggestions");
      if (features.length === 0) { box.classList.remove("open"); box.innerHTML = ""; return; }
      box.innerHTML = features.slice(0, 6).map((f, i) => {
        const label = f.properties?.label ?? "";
        return `<div data-i="${i}">${escapeHtml(label)}</div>`;
      }).join("");
      box.classList.add("open");
      box.querySelectorAll("div").forEach((el, i) => {
        el.addEventListener("click", () => {
          const f = features[i];
          const [lng, lat] = f.geometry.coordinates;
          state.origin = { lat, lng, label: f.properties.label };
          $("addressInput").value = f.properties.label;
          box.classList.remove("open");
          rerankAndRender();
          placeOriginMarker();
        });
      });
    }
    function hideSuggestions() {
      const box = $("suggestions");
      box.classList.remove("open"); box.innerHTML = "";
    }
    function placeOriginMarker() {
      if (originMarker) map.removeLayer(originMarker);
      if (!state.origin) return;
      originMarker = L.circleMarker([state.origin.lat, state.origin.lng], {
        radius: 10, weight: 3, color: "#38bdf8", fillColor: "#38bdf8", fillOpacity: 0.6,
      }).addTo(map);
      map.setView([state.origin.lat, state.origin.lng], 13);
    }

    function useGeolocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          state.origin = { lat: pos.coords.latitude, lng: pos.coords.longitude, label: "your location" };
          $("addressInput").value = "";
          rerankAndRender();
          placeOriginMarker();
        },
        (err) => { console.warn("geolocation failed", err); },
        { enableHighAccuracy: false, timeout: 8000 },
      );
    }

    // ---- orchestration ----------------------------------------------------
    function rerankAndRender() {
      const parsedForRank = state.parsed ?? { need: "unknown", ageGroups: [], dietaryFlags: [], accessibilityNeeds: [], urgency: "low" };
      state.decorated = rankSites(state.sites, parsedForRank, state.origin);
      renderMarkers();
      renderList();
      renderStatus();
    }

    async function runSearch() {
      const query = $("intentInput").value.trim();
      $("searchBtn").disabled = true;
      $("status").textContent = tr("loadingParse");
      if (!query) {
        state.parsed = null; state.parseSource = null; state.parseError = null;
      } else {
        const { parsed, source, reason } = await callParse(query);
        state.parsed = parsed;
        state.parseSource = source;
        state.parseError = reason ?? null;
        // Swap i18n dictionary based on detected language.
        const dict = await loadDict(parsed.detectedLanguage);
        state.lang = dict.lang;
        state.i18n = dict.dict;
        applyI18n();
      }
      renderBanners();
      renderParseBox();
      rerankAndRender();
      $("searchBtn").disabled = false;
    }

    // ---- wire events ------------------------------------------------------
    $("addressInput").addEventListener("input", (e) => {
      clearTimeout(acTimer);
      const v = e.target.value;
      acTimer = setTimeout(() => autocomplete(v), 250);
    });
    $("addressInput").addEventListener("blur", () => setTimeout(hideSuggestions, 200));
    $("geolocateBtn").addEventListener("click", useGeolocation);
    $("searchBtn").addEventListener("click", runSearch);
    $("intentInput").addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
    $("dateInput").addEventListener("change", (e) => {
      state.selectedDate = fromIsoDate(e.target.value);
      renderMarkers();
      renderList();
    });
    $("toggleLibraries").addEventListener("change", (e) => {
      if (e.target.checked) overlayLayers.libraries.addTo(map);
      else map.removeLayer(overlayLayers.libraries);
    });

    // ---- boot -------------------------------------------------------------
    (async () => {
      try {
        await loadData();
        applyI18n();
        $("dateInput").value = toIsoDate(state.selectedDate);
        rerankAndRender();
        fitToAllSites();
        renderStatus();
        // Overlay is additive & optional. Runs after core render — failure
        // here never blocks the map.
        await loadOverlays();
        renderLibraryLayer();
        if ($("toggleLibraries").checked) overlayLayers.libraries.addTo(map);
      } catch (err) {
        $("status").textContent = `Failed to load data: ${err.message ?? err}`;
      }
    })();
  </script>
</body>
</html>
