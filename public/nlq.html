<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NYC Summer Meals — accessibility-aware map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --green:  #22c55e;
      --amber:  #f59e0b;
      --red:    #ef4444;
      --bg:     #0b1220;
      --panel:  #101827;
      --raised: #182236;
      --text:   #e5e7eb;
      --muted:  #94a3b8;
      --border: #263041;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--text); background: var(--bg); overflow: hidden; }
    a { color: var(--accent); text-decoration: none; }

    /* Map fills the viewport behind everything. */
    #map { position: fixed; inset: 0; z-index: 0; }
    .leaflet-container { background: #0b1220; }

    /* Dim overlay above map, below panels. Pointer-events: none so map
       stays interactive on any visible edge. */
    #map-dim {
      position: fixed; inset: 0; z-index: 1;
      background: #000; opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    body.state-resting #map-dim { opacity: 0.55; }
    body.state-results #map-dim { opacity: 0.32; }

    /* Corner navigation always visible. */
    #corner-nav {
      position: fixed; top: 14px; right: 14px; z-index: 30; font-size: 12px;
      display: flex; gap: 8px;
    }
    #corner-nav a, #corner-nav button {
      display: inline-block; padding: 6px 12px;
      background: rgba(16, 24, 39, 0.7); border: 1px solid var(--border);
      border-radius: 999px; color: var(--accent);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      font-size: 12px; cursor: pointer;
    }

    /* Shared form styles. */
    input[type=text], input[type=date] {
      width: 100%; padding: 9px 10px; font-size: 14px;
      background: var(--raised); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-family: inherit;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    label { display: block; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
    button { padding: 9px 12px; font-size: 13px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--raised); color: var(--text); cursor: pointer;
      font-family: inherit; }
    button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: wait; }
    .row { display: flex; gap: 6px; }
    .row > input { flex: 1; }

    /* Address autocomplete panel. */
    .autocomplete { position: relative; }
    .suggestions {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--raised); border: 1px solid var(--border);
      border-top: none; border-radius: 0 0 6px 6px;
      max-height: 220px; overflow-y: auto; z-index: 400; display: none;
    }
    .suggestions.open { display: block; }
    .suggestions div { padding: 8px 10px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .suggestions div:hover { background: #1e293b; }
    .notice { font-size: 11px; color: var(--muted); line-height: 1.4; }

    /* ---- Resting state: large centered card ---- */
    #resting-panel {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; pointer-events: none;
    }
    body.state-results #resting-panel { display: none; }
    .rest-card {
      pointer-events: auto;
      width: 100%; max-width: 560px;
      background: rgba(16, 24, 39, 0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 32px 32px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .rest-card h1 { margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
    .rest-card .subtitle { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
    .rest-card .big-field { margin-bottom: 16px; }
    .rest-card input.big { padding: 15px 18px; font-size: 16px; border-radius: 8px; }
    .secondary-fields { display: grid; grid-template-columns: 1fr 160px; gap: 12px; margin-bottom: 16px; align-items: end; }
    @media (max-width: 460px) { .secondary-fields { grid-template-columns: 1fr; } }
    .rest-card button.primary { width: 100%; padding: 13px; font-size: 15px; margin-bottom: 14px; }

    /* ---- Results state: top bar + centered column ---- */
    #results-panel { position: fixed; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; }
    body.state-resting #results-panel { display: none; }
    #top-bar {
      pointer-events: auto;
      background: rgba(16, 24, 39, 0.88);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .query-pill {
      flex: 1; min-width: 200px; text-align: left;
      padding: 10px 16px; background: var(--raised); border: 1px solid var(--border);
      border-radius: 999px; color: var(--text); cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .query-pill:hover { border-color: var(--accent); }
    .query-pill .qt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .query-pill .edit-hint { font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .date-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--raised); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 10px 4px 12px;
    }
    .date-pill label { font-size: 11px; margin: 0; color: var(--muted); }
    .date-pill input {
      padding: 4px; font-size: 12px; background: transparent; border: none;
      color: var(--text); width: 128px;
    }
    .date-pill input:focus { outline: none; }
    .toggle-pill {
      display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
      background: var(--raised); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 12px; cursor: pointer;
    }
    .toggle-pill input { accent-color: var(--accent); margin: 0; }

    #results-column {
      pointer-events: auto;
      width: 100%; max-width: 640px;
      margin: 20px auto; padding: 0 12px 40px;
      flex: 1; overflow-y: auto;
    }
    #plainIntent {
      font-size: 13px; color: var(--muted); margin: 4px 0 14px;
      text-align: center; line-height: 1.5;
    }
    #plainIntent strong { color: var(--text); font-weight: 600; }
    #plainIntent .sep { opacity: 0.5; margin: 0 6px; }

    /* Banners. */
    .banner { font-size: 12px; padding: 10px 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid; line-height: 1.4; }
    .banner.warn { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.45); color: #fbbf24; }
    .banner.alert { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.5); color: #fca5a5; }

    #privacyNoticeResults { margin-top: 20px; text-align: center; padding: 10px; border-top: 1px solid var(--border); }

    /* ---- Verdict badge + chips (unchanged palette) ---- */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 10px; font-weight: 700; color: #0b1220;
      text-transform: uppercase; letter-spacing: 0.06em; }
    .badge.green { background: var(--green); }
    .badge.amber { background: var(--amber); }
    .badge.red { background: var(--red); }
    .chip { display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; margin-right: 4px; margin-top: 4px; border: 1px solid; }
    .chip.match { background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.45); color: #86efac; }
    .chip.unknown { background: rgba(148, 163, 184, 0.10); border-color: rgba(148, 163, 184, 0.35); color: var(--muted); }
    .chip.block { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }

    /* ---- Result cards (collapsed + expanded) ---- */
    .result-card {
      background: rgba(16, 24, 39, 0.92);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 8px; overflow: hidden;
    }
    .result-card:hover { border-color: #334155; }
    .result-card.expanded { border-color: var(--accent); }
    .result-header { padding: 14px 16px; cursor: pointer; display: flex; gap: 14px; align-items: flex-start; }
    .rc-badge-col { flex-shrink: 0; padding-top: 3px; width: 62px; text-align: center; }
    .rc-content { flex: 1; min-width: 0; }
    .rc-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .rc-addr { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .rc-meal { font-size: 12px; color: #cbd5e1; margin-bottom: 6px; line-height: 1.4; }
    .rc-meal .sep { color: var(--muted); margin: 0 4px; }
    .rc-meta { display: flex; gap: 12px; font-size: 11px; color: var(--muted); margin-bottom: 6px; align-items: center; }
    .rc-reason { font-size: 12.5px; color: var(--text); line-height: 1.4; }

    .result-body {
      padding: 0 16px 16px; display: none;
      border-top: 1px dashed var(--border); margin-top: 8px;
    }
    .result-card.expanded .result-body { display: block; }
    .result-body h3 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); margin: 14px 0 6px; font-weight: 600;
    }
    .result-body ul { margin: 4px 0; padding-left: 18px; font-size: 12px; }
    .result-body li { margin-bottom: 3px; word-break: break-word; }
    .result-body .meta-line { font-size: 12px; margin-top: 6px; }
    .result-body .meta-line .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; display: block; }

    /* ---- Overlay layer + corridor styles (unchanged) ---- */
    .lib-marker { background: #7c3aed; width: 12px; height: 12px; border: 2px solid #0b1220; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15); }
    .corridor { margin-top: 14px; }
    .corridor > .cor-heading { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
    .corridor-item { padding: 6px 0; border-top: 1px dashed var(--border); font-size: 12px; }
    .corridor-item:first-of-type { border-top: none; }
    .corridor-item .n { font-weight: 600; }
    .corridor-item .m { color: var(--muted); }
    .corridor-item .src { color: var(--muted); font-size: 10px; margin-top: 2px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .corridor-item .lib-chip { display: inline-block; background: rgba(124, 58, 237, 0.2); color: #c4b5fd; border: 1px solid rgba(124, 58, 237, 0.5); padding: 1px 6px; border-radius: 999px; font-size: 10px; margin-right: 4px; }
    .corridor-item .meal-chip { display: inline-block; background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.4); padding: 1px 6px; border-radius: 999px; font-size: 10px; margin-right: 4px; }
    .c311 { padding: 6px 0; border-top: 1px dashed var(--border); font-size: 12px; margin-top: 8px; }
    .c311 .n { font-weight: 600; margin-right: 6px; }
    .c311 .m { color: var(--muted); }
    .c311 .src { color: var(--muted); font-size: 10px; margin-top: 2px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .c311 .type-row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 11px; }
    .elev-note { background: rgba(124, 58, 237, 0.08); border-left: 3px solid rgba(124, 58, 237, 0.55); color: var(--text); padding: 8px 10px; border-radius: 3px; margin-top: 8px; font-size: 12px; line-height: 1.45; }
    .elev-note strong { color: #c4b5fd; }
    .elev-note .m { color: var(--muted); }
  </style>
</head>
<body class="state-resting">

  <div id="map"></div>
  <div id="map-dim"></div>

  <nav id="corner-nav">
    <a href="about.html">About</a>
  </nav>

  <!-- =========================================================
       Resting state: large centered card, address + date secondary
       ========================================================= -->
  <div id="resting-panel">
    <div class="rest-card">
      <h1 id="titleEl">NYC Summer Meals</h1>
      <p class="subtitle" id="subtitleEl">Free summer meals for anyone 18 and under. Verdict shows whether a step-free, elevator-served trip is possible.</p>

      <div class="big-field autocomplete">
        <label id="intentLabel" for="intentInput">What do you need?</label>
        <input id="intentInput" class="big" type="text" autocomplete="off" />
      </div>

      <div class="secondary-fields">
        <div class="autocomplete">
          <label id="addressLabel" for="addressInput">Your location (optional)</label>
          <div class="row">
            <input id="addressInput" type="text" autocomplete="off" />
            <button id="geolocateBtn" type="button" title="Use my location">📍</button>
          </div>
          <div id="suggestions" class="suggestions"></div>
        </div>
        <div>
          <label id="dateLabel" for="dateInput">Date to check</label>
          <input id="dateInput" class="date-sync" type="date" />
        </div>
      </div>

      <button id="searchBtn" class="primary" type="button">Search</button>

      <div class="notice" id="privacyNotice"></div>
    </div>
  </div>

  <!-- =========================================================
       Results state: top bar + centered results column
       ========================================================= -->
  <div id="results-panel">
    <div id="top-bar">
      <button id="editSearchBtn" class="query-pill" type="button">
        <span class="qt" id="queryText"></span>
        <span class="edit-hint" id="editHint">edit</span>
      </button>
      <div class="date-pill">
        <label for="dateInputTop" id="dateLabelTop">Date</label>
        <input id="dateInputTop" class="date-sync" type="date" />
      </div>
      <label class="toggle-pill" id="toggleLibrariesPill">
        <input type="checkbox" id="toggleLibraries" checked />
        <span id="toggleLibrariesLabel">Libraries</span>
      </label>
    </div>

    <div id="results-column">
      <div id="banners"></div>
      <div id="plainIntent"></div>
      <div id="results-list"></div>
      <div id="privacyNoticeResults" class="notice"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { getVerdict } from "./lib/verdict.js";
    import { keywordParse, rankSites, haversineMiles } from "./lib/filter.js";

    // ---- state ------------------------------------------------------------
    const state = {
      sites: [],
      stations: {},
      origin: null,
      parsed: null,
      parseSource: null,
      parseError: null,
      selectedDate: nextMondayOrTomorrow(),
      lang: "en",
      i18n: null,
      decorated: [],
      expandedId: null,
      lastQuery: "",
    };

    const $ = (id) => document.getElementById(id);
    const COLORS = { green: "#22c55e", amber: "#f59e0b", red: "#ef4444" };

    // ---- utility (unchanged) ---------------------------------------------
    function nextMondayOrTomorrow() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return d;
    }
    function toIsoDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }
    function fromIsoDate(s) {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function tr(key, vars = {}) {
      const dict = state.i18n ?? {};
      let s = dict[key] ?? key;
      for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, String(v));
      return s;
    }
    async function loadDict(lang) {
      const tryLang = ["en", "es", "zh", "bn", "ru"].includes(lang) ? lang : "en";
      try {
        const res = await fetch(`data/i18n/${tryLang}.json`);
        if (!res.ok) throw new Error(`i18n ${res.status}`);
        return { lang: tryLang, dict: await res.json() };
      } catch {
        const res = await fetch(`data/i18n/en.json`);
        return { lang: "en", dict: await res.json() };
      }
    }

    function applyI18n() {
      $("titleEl").textContent = tr("title");
      document.title = tr("title");
      $("intentLabel").textContent = tr("intentLabel");
      $("intentInput").placeholder = tr("intentPlaceholder");
      $("addressLabel").textContent = tr("addressLabel");
      $("addressInput").placeholder = tr("addressPlaceholder");
      $("geolocateBtn").title = tr("useLocation");
      $("privacyNotice").textContent = tr("privacyNotice");
      $("privacyNoticeResults").textContent = tr("privacyNotice");
      $("dateLabel").textContent = tr("dateLabel");
      $("dateLabelTop").textContent = tr("dateLabel");
      $("searchBtn").textContent = tr("searchButton");
      $("editHint").textContent = "edit";
      document.documentElement.lang = state.lang;
    }

    // ---- state machine ----------------------------------------------------
    function setMode(mode) {
      document.body.className = `state-${mode}`;
      if (mode === "resting") {
        // Focus back into the search box for immediate re-typing.
        setTimeout(() => $("intentInput").focus(), 60);
      }
    }

    function syncDateInputs() {
      const iso = toIsoDate(state.selectedDate);
      $("dateInput").value = iso;
      $("dateInputTop").value = iso;
    }

    // Plain-language sentence version of the parsed intent — replaces the
    // old JSON block per the operator's ask.
    const NEED_WORDS = { food: "food", transit: "transit", housing: "housing", health: "health", unknown: "help" };
    const LANG_WORDS = { en: "English", es: "Spanish", zh: "Chinese", bn: "Bengali", ru: "Russian" };
    const AGE_WORDS = { infant: "infant", child: "a child", teen: "a teen", adult: "an adult", senior: "a senior" };
    const DIETARY_WORDS = { halal: "halal", kosher: "kosher", vegetarian: "vegetarian", allergy: "allergy noted", medical: "medical diet" };
    const ACCESS_WORDS = { wheelchair: "wheelchair", walker: "walker", stroller: "stroller", vision: "vision support", hearing: "hearing support" };
    function describeParse(p) {
      if (!p) return "";
      const parts = [];
      parts.push(`Looking for <strong>${escapeHtml(NEED_WORDS[p.need] ?? p.need)}</strong>`);
      parts.push(escapeHtml(LANG_WORDS[p.detectedLanguage] ?? p.detectedLanguage ?? "unknown language"));
      if (p.urgency === "high") parts.push("<strong>urgent</strong>");
      const ages = (p.ageGroups ?? []).filter((a) => AGE_WORDS[a]).map((a) => AGE_WORDS[a]);
      if (ages.length) parts.push(`for ${escapeHtml(ages.join(", "))}`);
      const diets = (p.dietaryFlags ?? []).filter((d) => d !== "none" && DIETARY_WORDS[d]).map((d) => DIETARY_WORDS[d]);
      if (diets.length) parts.push(escapeHtml(diets.join(", ")));
      const access = (p.accessibilityNeeds ?? []).filter((a) => a !== "none" && ACCESS_WORDS[a]).map((a) => ACCESS_WORDS[a]);
      parts.push(access.length ? `${escapeHtml(access.join(", "))} needed` : "no accessibility needs stated");
      return parts.join('<span class="sep">·</span>');
    }

    // ---- one-line "what this is + when + which days" summary --------------
    // Reads only fields already in sites.json (siteType, hoursText, daysOpen).
    const DAY_ORDER_CANON = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    function siteTypeLabel(t) {
      if (t === "OPEN") return "Free summer meals";
      if (t === "OPEN RESTRICTED") return "Free summer meals (restricted access)";
      return "Free summer meals";
    }
    // "08:15am-09:15am" -> "8:15–9:15am". Trims leading zero, en-dash range,
    // drops start am/pm when it matches the end.
    function compactTime(s) {
      const m = s.match(/^\s*(\d{1,2}):(\d{2})(am|pm)\s*-\s*(\d{1,2}):(\d{2})(am|pm)\s*$/i);
      if (!m) return s;
      const [, h1, mm1, ap1, h2, mm2, ap2] = m;
      const start = `${parseInt(h1, 10)}:${mm1}${ap1.toLowerCase() === ap2.toLowerCase() ? "" : ap1.toLowerCase()}`;
      const end = `${parseInt(h2, 10)}:${mm2}${ap2.toLowerCase()}`;
      return `${start}–${end}`;
    }
    // "Breakfast 08:15am-09:15am, Lunch 12:00pm-03:00pm"
    //   -> "Breakfast 8:15–9:15am, Lunch 12:00–3:00pm"
    function formatHoursCompact(hoursText) {
      if (!hoursText) return "";
      return hoursText.split(",").map((seg) => {
        const t = seg.trim();
        const m = t.match(/^(.+?)\s+(\d{1,2}:\d{2}(?:am|pm)\s*-\s*\d{1,2}:\d{2}(?:am|pm))\s*$/i);
        return m ? `${m[1]} ${compactTime(m[2])}` : t;
      }).join(", ");
    }
    // ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"] -> "Sun–Sat"
    // ["Mon","Tue","Wed","Thu","Fri"] -> "Mon–Fri"
    // ["Mon","Wed","Fri"] -> "Mon, Wed, Fri"
    function compressDays(days) {
      if (!Array.isArray(days) || days.length === 0) return "";
      const idxs = [...new Set(days.map((d) => DAY_ORDER_CANON.indexOf(d)).filter((i) => i >= 0))].sort((a, b) => a - b);
      if (idxs.length === 0) return "";
      const runs = [];
      let start = idxs[0], prev = idxs[0];
      for (let i = 1; i < idxs.length; i++) {
        if (idxs[i] === prev + 1) { prev = idxs[i]; continue; }
        runs.push([start, prev]);
        start = idxs[i]; prev = idxs[i];
      }
      runs.push([start, prev]);
      return runs.map(([s, e]) => (s === e ? DAY_ORDER_CANON[s] : `${DAY_ORDER_CANON[s]}–${DAY_ORDER_CANON[e]}`)).join(", ");
    }
    function mealLine(site) {
      const parts = [siteTypeLabel(site.siteType)];
      const hrs = formatHoursCompact(site.hoursText);
      if (hrs) parts.push(hrs);
      const days = compressDays(site.daysOpen);
      if (days) parts.push(days);
      return parts.join(' <span class="sep">·</span> ');
    }

    // ---- map (unchanged) --------------------------------------------------
    const map = L.map("map").setView([40.7580, -73.9855], 11);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      subdomains: "abcd",
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    }).addTo(map);
    const markers = new Map();
    let originMarker = null;
    const overlayLayers = { libraries: L.layerGroup() };
    let overlaysData = null;

    // ---- data load (unchanged) -------------------------------------------
    async function loadData() {
      const [sites, stations, dict] = await Promise.all([
        fetch("data/sites.json").then((r) => r.json()),
        fetch("data/stations.json").then((r) => r.json()),
        loadDict("en"),
      ]);
      state.sites = sites;
      state.stations = stations;
      state.lang = dict.lang;
      state.i18n = dict.dict;
    }

    async function loadOverlays() {
      try {
        const res = await fetch("data/overlays.json");
        if (!res.ok) return;
        overlaysData = await res.json();
      } catch (err) {
        console.warn("overlays.json unavailable — corridor context disabled", err);
        overlaysData = null;
      }
    }

    function renderLibraryLayer() {
      overlayLayers.libraries.clearLayers();
      if (!overlaysData) return;
      const seen = new Map();
      for (const [siteId, entry] of Object.entries(overlaysData)) {
        if (siteId.startsWith("_")) continue;
        for (const lib of entry.libraries ?? []) {
          if (!seen.has(lib.id)) seen.set(lib.id, lib);
        }
      }
      for (const lib of seen.values()) {
        const icon = L.divIcon({ className: "", html: '<div class="lib-marker"></div>', iconSize: [12, 12], iconAnchor: [6, 6] });
        const marker = L.marker([lib.lat, lib.lng], { icon });
        marker.bindTooltip(`${lib.name} (${lib.system})`, { direction: "top", offset: [0, -6] });
        overlayLayers.libraries.addLayer(marker);
      }
    }

    // ---- verdict / marker helpers (unchanged) -----------------------------
    function stationFor(site) {
      return site.nearestStationId ? state.stations[site.nearestStationId] : null;
    }
    function verdictFor(site) {
      return getVerdict(site, stationFor(site), state.selectedDate);
    }

    function renderMarkers() {
      for (const m of markers.values()) map.removeLayer(m);
      markers.clear();
      const rows = state.decorated.length
        ? state.decorated
        : state.sites.map((s) => ({ site: s, distanceMiles: null, chips: [] }));
      for (const row of rows) {
        const site = row.site;
        if (site.lat == null || site.lng == null) continue;
        const v = verdictFor(site);
        const marker = L.circleMarker([site.lat, site.lng], {
          radius: 8,
          weight: 2,
          color: "#0b1220",
          fillColor: COLORS[v.state] ?? "#94a3b8",
          fillOpacity: 0.95,
        }).addTo(map);
        marker.on("click", () => {
          state.expandedId = site.id;
          renderList();
          document.querySelector(`.result-card[data-id="${CSS.escape(site.id)}"]`)?.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        markers.set(site.id, marker);
      }
    }

    function fitToAllSites() {
      const pts = state.sites
        .filter((s) => s.lat != null && s.lng != null)
        .map((s) => [s.lat, s.lng]);
      if (pts.length === 0) return;
      map.fitBounds(L.latLngBounds(pts), { padding: [40, 40] });
    }

    // ---- Along-the-way corridor block (unchanged content, appears inside
    //      the expanded result body) -----------------------------------------
    function renderCorridorSection(site) {
      if (!overlaysData) return "";
      const entry = overlaysData[site.id];
      if (!entry) return "";
      const libs = Array.isArray(entry.libraries) ? entry.libraries : [];
      const c311 = entry.complaints311 ?? null;
      const has311 = c311 && c311.total > 0;
      if (libs.length === 0 && !has311) return "";

      const libSrc = overlaysData._meta?.sources?.libraries;
      const libSrcLine = libSrc
        ? `${escapeHtml(libSrc.dataset)} · pulled ${escapeHtml((libSrc.pulled_at ?? "").slice(0, 10))}`
        : "";

      const libItems = libs.map((lib) => `
        <div class="corridor-item">
          <span class="lib-chip">${escapeHtml(lib.system ?? "Library")}</span>
          ${lib.isMealSite ? '<span class="meal-chip">★ also a meal site</span>' : ""}
          <span class="n">${escapeHtml(lib.name)}</span>
          <span class="m"> — ${escapeHtml(lib.address)}</span>
          <div class="m">${lib.distanceMeters != null ? lib.distanceMeters + " m along the corridor" : ""}</div>
          ${libSrcLine ? `<div class="src">${libSrcLine}</div>` : ""}
        </div>
      `).join("");

      let c311Block = "";
      if (has311) {
        const src = overlaysData._meta?.sources?.complaints311;
        const srcLine = src
          ? `${escapeHtml(src.dataset)} · last ${src.lookback_days ?? 90} days · pulled ${escapeHtml((src.pulled_at ?? "").slice(0, 10))}`
          : "";
        const typeRows = Object.entries(c311.byType)
          .sort((a, b) => b[1] - a[1])
          .map(([type, n]) => `<div class="type-row"><span>${escapeHtml(type)}</span><span class="m">${n}</span></div>`)
          .join("");

        let elevatorBlock = "";
        const elevDetail = c311.byTypeDetail?.Elevator;
        if (elevDetail && elevDetail.count > 0) {
          const agencies = Object.keys(elevDetail.byAgency ?? {}).sort();
          const agencyLabel = agencies.length > 0 ? agencies.join("/") : "DOB/HPD";
          const singleDeviceCount = elevDetail.byDescriptor?.["Elevator - Single Device On Property/No Alternate Service"] ?? 0;
          const singleSentence = singleDeviceCount > 0
            ? ` ${singleDeviceCount} of these were &ldquo;single device, no alternate service&rdquo; &mdash; a building with one elevator and no backup.`
            : "";
          elevatorBlock = `
            <div class="elev-note">
              <strong>${elevDetail.count} building-elevator complaint${elevDetail.count === 1 ? "" : "s"}</strong>
              filed within 300m in the last ${src?.lookback_days ?? 90} days
              (${escapeHtml(agencyLabel)}).${singleSentence}
              These are residential buildings, not the subway station.
              <div class="m" style="margin-top:4px">Source: NYC 311 (erm2-nwe9)</div>
            </div>
          `;
        }

        c311Block = `
          <div class="c311">
            <div><span class="n">311 complaints in corridor</span><span class="m">${c311.total} total, last ${src?.lookback_days ?? 90} days</span></div>
            ${typeRows}
            ${srcLine ? `<div class="src">${srcLine}</div>` : ""}
            ${elevatorBlock}
          </div>
        `;
      }

      const parts = [`<div class="corridor">`, `<div class="cor-heading">Along the way</div>`];
      if (libs.length > 0) parts.push(`<div style="margin-bottom:6px;font-size:11px;color:var(--muted);">Libraries (${libs.length})</div>`, libItems);
      if (c311Block) parts.push(c311Block);
      parts.push(`</div>`);
      return parts.join("");
    }

    // ---- results list: collapsed cards, expandable inline ----------------
    function renderList() {
      const list = $("results-list");
      list.innerHTML = "";
      if (!state.decorated.length) {
        list.innerHTML = `<div class="notice" style="text-align:center;padding:20px 0">No sites to show.</div>`;
        return;
      }
      const rows = state.decorated;
      for (const row of rows) {
        const site = row.site;
        const v = verdictFor(site);
        const isExpanded = state.expandedId === site.id;
        const distText = row.distanceMiles != null ? `${row.distanceMiles.toFixed(1)} mi away` : "";
        const topReason = v.reasons[0] ?? "";

        const card = document.createElement("div");
        card.className = "result-card" + (isExpanded ? " expanded" : "");
        card.setAttribute("data-id", site.id);
        card.innerHTML = `
          <div class="result-header">
            <div class="rc-badge-col"><span class="badge ${v.state}">${tr("verdict" + v.state[0].toUpperCase() + v.state.slice(1))}</span></div>
            <div class="rc-content">
              <div class="rc-name">${escapeHtml(site.name)}</div>
              <div class="rc-addr">${escapeHtml(site.address)}</div>
              <div class="rc-meal">${mealLine(site)}</div>
              <div class="rc-meta">${distText ? `<span>${escapeHtml(distText)}</span>` : ""}${row.chips.map((c) => `<span class="chip ${c.kind}">${escapeHtml(c.text)}</span>`).join("")}</div>
              ${topReason ? `<div class="rc-reason">${escapeHtml(topReason)}</div>` : ""}
            </div>
          </div>
          ${isExpanded ? renderResultBody(row, v) : ""}
        `;
        card.querySelector(".result-header").addEventListener("click", () => {
          state.expandedId = isExpanded ? null : site.id;
          renderList();
          if (!isExpanded) {
            const m = markers.get(site.id);
            if (m) map.setView(m.getLatLng(), Math.max(map.getZoom(), 14));
          }
        });
        list.appendChild(card);
      }
    }

    // Expanded card body: verdict reasons, provenance (never behind a
    // toggle), site meta, Along-the-way corridor.
    function renderResultBody(row, v) {
      const site = row.site;
      const station = stationFor(site);
      const days = Array.isArray(site.daysOpen) ? site.daysOpen.join(", ") : "";
      const phoneLink = site.phone
        ? `<a href="tel:${escapeHtml(String(site.phone).replace(/[^0-9+]/g, ""))}">${escapeHtml(site.phone)}</a>`
        : "";
      return `
        <div class="result-body">
          <h3>${escapeHtml(tr("verdictReasons"))}</h3>
          <ul>${v.reasons.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul>
          <h3>${escapeHtml(tr("provenance"))}</h3>
          <ul>${v.provenance.map((p) => `<li>${escapeHtml(p)}</li>`).join("")}</ul>
          ${phoneLink ? `<div class="meta-line"><span class="k">${escapeHtml(tr("phone"))}</span>${phoneLink}</div>` : ""}
          ${days ? `<div class="meta-line"><span class="k">${escapeHtml(tr("open"))}</span>${escapeHtml(days)}</div>` : ""}
          ${site.hoursText ? `<div class="meta-line"><span class="k">${escapeHtml(tr("hours"))}</span>${escapeHtml(site.hoursText)}</div>` : ""}
          ${site.nearestStationId ? `<div class="meta-line"><span class="k">${escapeHtml(tr("nearestStation"))}</span>${escapeHtml(site.nearestStationId)}${station ? ` — ADA=${station.ada}, ${station.elevators?.length ?? 0} elevators` : ""}</div>` : ""}
          ${renderCorridorSection(site)}
        </div>
      `;
    }

    function renderBanners() {
      const b = $("banners");
      const parts = [];
      if (state.parseSource === "fallback") {
        parts.push(`<div class="banner warn">${escapeHtml(tr("fallbackNotice"))}${state.parseError ? " (" + escapeHtml(state.parseError) + ")" : ""}</div>`);
      }
      if (state.parsed?.allergyWarning) {
        parts.push(`<div class="banner alert">${escapeHtml(tr("allergyWarning"))}</div>`);
      }
      b.innerHTML = parts.join("");
    }

    function renderPlainIntent() {
      $("plainIntent").innerHTML = state.parsed ? describeParse(state.parsed) : "";
    }

    function renderQueryPill() {
      $("queryText").textContent = state.lastQuery || "(no query)";
    }

    // ---- parse call (unchanged; address never sent) ----------------------
    async function callParse(query) {
      try {
        const res = await fetch("../api/parse", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ query }),
        });
        if (!res.ok) return { parsed: keywordParse(query), source: "fallback", reason: `api ${res.status}` };
        const parsed = await res.json();
        return { parsed, source: "api" };
      } catch (err) {
        return { parsed: keywordParse(query), source: "fallback", reason: String(err.message ?? err) };
      }
    }

    // ---- geocoding (client-side only) ------------------------------------
    let acTimer = null;
    async function autocomplete(text) {
      if (!text || text.length < 3) { hideSuggestions(); return; }
      try {
        const url = `https://geosearch.planninglabs.nyc/v2/autocomplete?text=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        if (!res.ok) { hideSuggestions(); return; }
        const data = await res.json();
        showSuggestions(data.features ?? []);
      } catch {
        hideSuggestions();
      }
    }
    function showSuggestions(features) {
      const box = $("suggestions");
      if (features.length === 0) { box.classList.remove("open"); box.innerHTML = ""; return; }
      box.innerHTML = features.slice(0, 6).map((f, i) => {
        const label = f.properties?.label ?? "";
        return `<div data-i="${i}">${escapeHtml(label)}</div>`;
      }).join("");
      box.classList.add("open");
      box.querySelectorAll("div").forEach((el, i) => {
        el.addEventListener("click", () => {
          const f = features[i];
          const [lng, lat] = f.geometry.coordinates;
          state.origin = { lat, lng, label: f.properties.label };
          $("addressInput").value = f.properties.label;
          box.classList.remove("open");
          rerankAndRender();
          placeOriginMarker();
        });
      });
    }
    function hideSuggestions() {
      const box = $("suggestions");
      box.classList.remove("open"); box.innerHTML = "";
    }
    function placeOriginMarker() {
      if (originMarker) map.removeLayer(originMarker);
      if (!state.origin) return;
      originMarker = L.circleMarker([state.origin.lat, state.origin.lng], {
        radius: 10, weight: 3, color: "#38bdf8", fillColor: "#38bdf8", fillOpacity: 0.6,
      }).addTo(map);
      map.setView([state.origin.lat, state.origin.lng], 13);
    }

    function useGeolocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          state.origin = { lat: pos.coords.latitude, lng: pos.coords.longitude, label: "your location" };
          $("addressInput").value = "";
          rerankAndRender();
          placeOriginMarker();
        },
        (err) => { console.warn("geolocation failed", err); },
        { enableHighAccuracy: false, timeout: 8000 },
      );
    }

    // ---- orchestration ----------------------------------------------------
    function rerankAndRender() {
      const parsedForRank = state.parsed ?? { need: "unknown", ageGroups: [], dietaryFlags: [], accessibilityNeeds: [], urgency: "low" };
      state.decorated = rankSites(state.sites, parsedForRank, state.origin);
      renderMarkers();
      renderList();
    }

    async function runSearch() {
      const query = $("intentInput").value.trim();
      $("searchBtn").disabled = true;
      state.lastQuery = query;
      state.expandedId = null;
      if (!query) {
        state.parsed = null; state.parseSource = null; state.parseError = null;
      } else {
        const { parsed, source, reason } = await callParse(query);
        state.parsed = parsed;
        state.parseSource = source;
        state.parseError = reason ?? null;
        const dict = await loadDict(parsed.detectedLanguage);
        state.lang = dict.lang;
        state.i18n = dict.dict;
        applyI18n();
      }
      renderBanners();
      renderPlainIntent();
      renderQueryPill();
      rerankAndRender();
      setMode("results");
      $("searchBtn").disabled = false;
    }

    function editSearch() {
      setMode("resting");
      // Preserve the query so operator can tweak.
      $("intentInput").value = state.lastQuery;
      $("intentInput").select();
    }

    // ---- wire events ------------------------------------------------------
    $("addressInput").addEventListener("input", (e) => {
      clearTimeout(acTimer);
      const v = e.target.value;
      acTimer = setTimeout(() => autocomplete(v), 250);
    });
    $("addressInput").addEventListener("blur", () => setTimeout(hideSuggestions, 200));
    $("geolocateBtn").addEventListener("click", useGeolocation);
    $("searchBtn").addEventListener("click", runSearch);
    $("intentInput").addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
    $("editSearchBtn").addEventListener("click", editSearch);

    // Date sync: either input drives state.selectedDate; the other mirrors.
    document.querySelectorAll(".date-sync").forEach((inp) => {
      inp.addEventListener("change", (e) => {
        state.selectedDate = fromIsoDate(e.target.value);
        syncDateInputs();
        renderMarkers();
        renderList();
      });
    });

    $("toggleLibraries").addEventListener("change", (e) => {
      if (e.target.checked) overlayLayers.libraries.addTo(map);
      else map.removeLayer(overlayLayers.libraries);
    });

    // ---- boot -------------------------------------------------------------
    (async () => {
      try {
        await loadData();
        applyI18n();
        syncDateInputs();
        rerankAndRender();
        fitToAllSites();
        await loadOverlays();
        renderLibraryLayer();
        if ($("toggleLibraries").checked) overlayLayers.libraries.addTo(map);
        setMode("resting");
      } catch (err) {
        // Even if boot fails, keep the resting card visible so users see
        // *something*. Toss a banner into the results panel just in case.
        $("banners").innerHTML = `<div class="banner alert">Failed to load data: ${escapeHtml(err.message ?? String(err))}</div>`;
      }
    })();
  </script>
</body>
</html>
